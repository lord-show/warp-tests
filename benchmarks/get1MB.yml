warp:
  api: v1
  benchmark: get
  quiet: false
  no-color: false
  json: false
  bench-data: {{ .BENCH_DATA }}
  # S3 connection and target parameters
  remote:
    region: ru-central1
    access-key: {{ .S3_ACCESS_KEY }}
    secret-key: {{ .S3_SECRET_KEY }}
    host: {{ .S3_ENDPOINT }}
    bucket: {{ .BUCKET }}
    tls: {{ .TLS }}
    insecure: {{ .INSECURE }}
  # Benchmark parameters configuration
  params: # This bucket will be cleared before and after the test
    duration: {{ .DURATION }}
    objects: 10000
    obj:
      size: 1MB
      rand-size: false
